<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="topbar-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  <button class="icon-btn theme-btn" id="theme-btn" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>

  <div class="shell">
    {% include sidebar.html %}
    <div class="scrim" id="scrim"></div>
    <main class="main">
      {{ content }}
      <footer class="site-footer">
        © {{ site.time | date: "%Y" }} {{ site.author }} · Built with Jekyll
      </footer>
    </main>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% if page.mermaid %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>window.renderMermaid && window.renderMermaid();</script>
  {% endif %}
</body>
</html>
